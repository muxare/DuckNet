name: Deploy Center

on:
  workflow_dispatch:
    inputs:
      center:
        description: Center to deploy
        required: true
        type: choice
        options:
          - telemetry
          - alarm
          - dashboard
          - billing
          - all
      environment:
        description: Target environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "src/DuckNet.TelemetryCenter/**"
      - "src/DuckNet.AlarmCenter/**"
      - "src/DuckNet.DashboardCenter/**"
      - "src/DuckNet.BillingCenter/**"
      - "src/DuckNet.Contracts/**"
      - "src/DuckNet.EventBus/**"
      - "src/DuckNet.ServiceDefaults/**"
      - "infra/docker/**"

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      centers: ${{ steps.pick.outputs.centers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CENTER="${{ inputs.center }}"
            if [ "$CENTER" = "all" ]; then
              echo 'centers=["telemetry","alarm","dashboard","billing"]' >> "$GITHUB_OUTPUT"
            else
              echo "centers=[\"$CENTER\"]" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          CENTERS=()
          # Contract / bus change → every Center (shared wire types + upcasters).
          if git diff --name-only HEAD~1 HEAD | grep -Eq 'src/DuckNet.Contracts/|src/DuckNet.EventBus/|src/DuckNet.ServiceDefaults/'; then
            CENTERS=(telemetry alarm dashboard billing)
          else
            git diff --name-only HEAD~1 HEAD | grep -q 'src/DuckNet.TelemetryCenter/' && CENTERS+=(telemetry)
            git diff --name-only HEAD~1 HEAD | grep -q 'src/DuckNet.AlarmCenter/' && CENTERS+=(alarm)
            git diff --name-only HEAD~1 HEAD | grep -q 'src/DuckNet.DashboardCenter/' && CENTERS+=(dashboard)
            git diff --name-only HEAD~1 HEAD | grep -q 'src/DuckNet.BillingCenter/' && CENTERS+=(billing)
          fi

          if [ ${#CENTERS[@]} -eq 0 ]; then
            echo 'centers=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON=$(printf '"%s",' "${CENTERS[@]}")
          echo "centers=[${JSON%,}]" >> "$GITHUB_OUTPUT"

  deploy:
    needs: matrix
    if: ${{ needs.matrix.outputs.centers != '[]' && needs.matrix.outputs.centers != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        center: ${{ fromJson(needs.matrix.outputs.centers) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${{ github.repository_owner }}/ducknet-${{ matrix.center }}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          case "${{ matrix.center }}" in
            telemetry) echo "dockerfile=infra/docker/DuckNet.TelemetryCenter/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            alarm) echo "dockerfile=infra/docker/DuckNet.AlarmCenter/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            dashboard) echo "dockerfile=infra/docker/DuckNet.DashboardCenter/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            billing) echo "dockerfile=infra/docker/DuckNet.BillingCenter/Dockerfile" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build image
        run: docker build -f "${{ steps.image.outputs.dockerfile }}" -t "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}" .

      - name: Login GHCR
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          docker tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}" "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"
          docker push "${{ steps.image.outputs.name }}:latest"

      - name: Smoke (local image)
        run: |
          docker run -d --name ducknet-smoke -p 8080:8080 "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              docker rm -f ducknet-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs ducknet-smoke || true
          docker rm -f ducknet-smoke
          exit 1

  azure:
    needs: [matrix, deploy]
    if: github.event_name == 'workflow_dispatch' && needs.matrix.outputs.centers != '[]' && needs.matrix.outputs.centers != ''
    runs-on: ubuntu-latest
    environment: azure-${{ inputs.environment }}
    permissions:
      contents: read
      id-token: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        center: ${{ fromJson(needs.matrix.outputs.centers) }}
    steps:
      - uses: actions/checkout@v4

      - name: Check OIDC configuration
        id: oidc
        run: |
          if [ -n "${{ vars.AZURE_CLIENT_ID }}" ] && [ -n "${{ vars.AZURE_TENANT_ID }}" ] && [ -n "${{ vars.AZURE_SUBSCRIPTION_ID }}" ] && [ -n "${{ vars.AZURE_RESOURCE_GROUP }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "OIDC vars missing — skip Azure job (Step 12b)."
          fi

      - uses: azure/login@v2
        if: steps.oidc.outputs.configured == 'true'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # GHCR packages pushed by the deploy job are private by default;
      # an anonymous pull on this fresh runner would be denied.
      - name: Login GHCR
        if: steps.oidc.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: ACR push and Container App revision
        if: steps.oidc.outputs.configured == 'true'
        env:
          CENTER: ${{ matrix.center }}
          TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          TAG12="${TAG:0:12}"
          RG="${{ vars.AZURE_RESOURCE_GROUP }}"
          ACR="$(az acr list --resource-group "$RG" --query "[0].name" -o tsv || true)"
          if [ -z "$ACR" ]; then
            echo "No ACR in $RG (12b / infra not applied). Skip containerapp update."
            exit 0
          fi
          az acr login --name "$ACR"
          SRC="ghcr.io/${{ github.repository_owner }}/ducknet-${CENTER}:${TAG12}"
          DST="${ACR}.azurecr.io/ducknet-${CENTER}:${TAG12}"
          docker pull "$SRC"
          docker tag "$SRC" "$DST"
          docker push "$DST"
          APP="ducknet-${CENTER}"
          if ! az containerapp show --name "$APP" --resource-group "$RG" >/dev/null 2>&1; then
            echo "Container App $APP not found (12b). Skip revision update."
            exit 0
          fi
          az containerapp update --name "$APP" --resource-group "$RG" --image "$DST"
          FQDN="$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
          curl -fsS "https://${FQDN}/health"

      - name: Skip Azure
        if: steps.oidc.outputs.configured != 'true'
        run: echo "No Entra OIDC vars. GHCR deploy already ran; Azure mutate waits for 12c bootstrap."

