name: Claude PR Review

# Advisory only. `ci.yml` is the merge gate. Jobs fail on missing auth / broken
# orchestration, never on a review verdict.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs-only PRs are not worth model calls. A mixed PR (code + docs)
    # still runs because GitHub skips only when *every* path matches.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.html'

permissions:
  contents: read
  pull-requests: write

# A rapid series of pushes should not stack up reviews on the same PR.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CLAUDE_CLI_VERSION: '2.1.246'
  TRIAGE_BUDGET_USD: '0.10'
  SPECIALIST_BUDGET_USD: '0.15'
  SMALL_DIFF_BYTES: '50000'
  SPECIALIST_DIFF_BYTES: '200000'

jobs:
  triage:
    name: triage · risk and routing
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      wants_architecture: ${{ steps.state.outputs.wants_architecture }}
      wants_security: ${{ steps.state.outputs.wants_security }}
      skipped: ${{ steps.state.outputs.skipped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI (pinned)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"

      - name: Build triage input
        id: files
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"

          jq -n \
            --argjson number "$PR_NUMBER" \
            --arg title "$PR_TITLE" \
            --arg sha "$PR_SHA" \
            '{number: $number, title: $title, sha: $sha}' > pr.json

          git diff --numstat "origin/${BASE_REF}...HEAD" \
            | bash .github/scripts/numstat-to-json.sh > files-git.json

          git diff "origin/${BASE_REF}...HEAD" > full.diff
          DIFF_BYTES=$(wc -c < full.diff)
          echo "diff size: ${DIFF_BYTES} bytes"

          {
            cat .github/prompts/triage.md
            printf '\n\n## Pull request\n\n- number: %s\n- title: %s\n- sha: %s\n' \
              "$PR_NUMBER" "$PR_TITLE" "$PR_SHA"
            printf '\n## Changed files (numstat)\n\n```\n'
            git diff --numstat "origin/${BASE_REF}...HEAD"
            printf '\n```\n'
            if [ "$DIFF_BYTES" -le "$SMALL_DIFF_BYTES" ]; then
              printf '\n## Full diff (small PR)\n\n```diff\n'
              cat full.diff
              printf '\n```\n'
            else
              printf '\n## Note\n\nFull diff omitted (%s bytes). Classify from paths and numstat only.\n' \
                "$DIFF_BYTES"
            fi
          } > review-input.md

      - name: Run triage
        id: claude
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          bash .github/scripts/run-claude.sh \
            --schema .github/schemas/triage.schema.json \
            --model haiku \
            --budget "$TRIAGE_BUDGET_USD" \
            --tools none \
            --input review-input.md \
            --output review.json \
            --meta "$GITHUB_OUTPUT"
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo "::error::Triage cannot run without CLAUDE_CODE_OAUTH_TOKEN."
            exit 1
          fi

      - name: Merge review state
        id: state
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          extra=()
          if jq -e '.structured_output.risk' review.json >/dev/null 2>&1; then
            jq '.structured_output' review.json > triage-claude.json
            extra=(triage-claude.json)
          else
            echo "::warning::Triage returned no structured output; using path-based fallback."
          fi

          bash .github/scripts/merge-triage-state.sh pr.json files-git.json "${extra[@]}" \
            > review-state.json

          echo "wants_architecture=$(jq -r 'any(.requestedReviewers[]; . == "architecture")' review-state.json)" >> "$GITHUB_OUTPUT"
          echo "wants_security=$(jq -r 'any(.requestedReviewers[]; . == "security")' review-state.json)" >> "$GITHUB_OUTPUT"
          echo "skipped=$(jq -r '.skipped' review-state.json)" >> "$GITHUB_OUTPUT"
          jq '{risk, requestedReviewers, skipped, files: [.files[].path]}' review-state.json

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          obj=review-state.json
          if [ -f triage-claude.json ]; then
            obj=triage-claude.json
          elif [ ! -f review-state.json ]; then
            echo "No structured object to summarize."
            exit 0
          fi
          cost=""
          turns=""
          if [ -f review.json ]; then
            cost=$(jq -r '.total_cost_usd // empty' review.json)
            turns=$(jq -r '.num_turns // empty' review.json)
          fi
          bash .github/scripts/write-review-job-summary.sh \
            --role triage \
            --object "$obj" \
            --model haiku \
            --budget "$TRIAGE_BUDGET_USD" \
            --schema .github/schemas/triage.schema.json \
            --tools none \
            --cost "$cost" \
            --turns "$turns" \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: review-state
          path: review-state.json
          if-no-files-found: error

  architecture:
    name: architecture · five rules
    needs: triage
    if: needs.triage.result == 'success' && needs.triage.outputs.wants_architecture == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI (pinned)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"

      - uses: actions/download-artifact@v4
        with:
          name: review-state

      - name: Build specialist input
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          {
            cat .github/prompts/architecture-review.md
            printf '\n\n## Review state\n\n```json\n'
            cat review-state.json
            printf '\n```\n\n## Diff of architecture-tagged files\n\n```diff\n'
            bash .github/scripts/filter-diff.sh \
              review-state.json architecture "origin/${BASE_REF}...HEAD" "$SPECIALIST_DIFF_BYTES"
            printf '\n```\n'
          } > review-input.md

      - name: Run architecture review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          bash .github/scripts/run-claude.sh \
            --schema .github/schemas/reviewer-findings.schema.json \
            --model haiku \
            --budget "$SPECIALIST_BUDGET_USD" \
            --tools none \
            --input review-input.md \
            --output review.json \
            --meta "$GITHUB_OUTPUT"
          rc=$?
          set -e
          # Auth already gated triage. Model/budget failures become a degraded artifact.
          if [ "$rc" -eq 2 ]; then
            echo '{"reviewer":"architecture","findings":[],"notes":[],"error":"missing_token"}' \
              > findings-architecture.json
          else
            bash .github/scripts/extract-findings.sh architecture review.json findings-architecture.json
          fi

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f findings-architecture.json ]; then
            echo "No structured object to summarize."
            exit 0
          fi
          cost=""
          turns=""
          if [ -f review.json ]; then
            cost=$(jq -r '.total_cost_usd // empty' review.json)
            turns=$(jq -r '.num_turns // empty' review.json)
          fi
          bash .github/scripts/write-review-job-summary.sh \
            --role architecture \
            --object findings-architecture.json \
            --model haiku \
            --budget "$SPECIALIST_BUDGET_USD" \
            --schema .github/schemas/reviewer-findings.schema.json \
            --tools none \
            --cost "$cost" \
            --turns "$turns" \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findings-architecture
          path: findings-architecture.json
          if-no-files-found: error

  security:
    name: security · secrets and parse
    needs: triage
    if: needs.triage.result == 'success' && needs.triage.outputs.wants_security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI (pinned)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"

      - uses: actions/download-artifact@v4
        with:
          name: review-state

      - name: Build specialist input
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE_REF"
          {
            cat .github/prompts/security-review.md
            printf '\n\n## Review state\n\n```json\n'
            cat review-state.json
            printf '\n```\n\n## Diff of security-tagged files\n\n```diff\n'
            bash .github/scripts/filter-diff.sh \
              review-state.json security "origin/${BASE_REF}...HEAD" "$SPECIALIST_DIFF_BYTES"
            printf '\n```\n'
          } > review-input.md

      - name: Run security review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set +e
          bash .github/scripts/run-claude.sh \
            --schema .github/schemas/reviewer-findings.schema.json \
            --model haiku \
            --budget "$SPECIALIST_BUDGET_USD" \
            --tools none \
            --input review-input.md \
            --output review.json \
            --meta "$GITHUB_OUTPUT"
          rc=$?
          set -e
          if [ "$rc" -eq 2 ]; then
            echo '{"reviewer":"security","findings":[],"notes":[],"error":"missing_token"}' \
              > findings-security.json
          else
            bash .github/scripts/extract-findings.sh security review.json findings-security.json
          fi

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          if [ ! -f findings-security.json ]; then
            echo "No structured object to summarize."
            exit 0
          fi
          cost=""
          turns=""
          if [ -f review.json ]; then
            cost=$(jq -r '.total_cost_usd // empty' review.json)
            turns=$(jq -r '.num_turns // empty' review.json)
          fi
          bash .github/scripts/write-review-job-summary.sh \
            --role security \
            --object findings-security.json \
            --model haiku \
            --budget "$SPECIALIST_BUDGET_USD" \
            --schema .github/schemas/reviewer-findings.schema.json \
            --tools none \
            --cost "$cost" \
            --turns "$turns" \
            >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: findings-security
          path: findings-security.json
          if-no-files-found: error

  aggregate:
    name: aggregate · comment
    needs: [triage, architecture, security]
    if: always() && !cancelled() && needs.triage.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Aggregate
        env:
          PR_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          state=$(find artifacts -name review-state.json | head -n 1)
          [ -n "$state" ] || { echo "::error::review-state.json artifact missing"; exit 1; }

          args=(
            --state "$state"
            --out-state aggregated-state.json
            --out-comment comment.md
            --out-summary summary.json
            --sha "$PR_SHA"
          )
          arch=$(find artifacts -name findings-architecture.json | head -n 1 || true)
          sec=$(find artifacts -name findings-security.json | head -n 1 || true)
          [ -n "${arch:-}" ] && args+=(--findings "$arch")
          [ -n "${sec:-}" ] && args+=(--findings "$sec")

          bash .github/scripts/aggregate-review.sh "${args[@]}"
          cat comment.md
          bash .github/scripts/write-review-job-summary.sh \
            --role aggregate \
            --object summary.json \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update review comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- ducknet-reviewflow -->';
            if (!fs.existsSync('comment.md')) {
              core.setFailed('comment.md was not produced');
              return;
            }
            const body = `${MARKER}\n${fs.readFileSync('comment.md', 'utf8')}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated existing review comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Created review comment');
            }
