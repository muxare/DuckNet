name: Claude backlog build

# Build a backlog from the description/vision documents and the code, then let
# an independent session check every candidate against the repository before
# anything is filed. Dispatch only: a backlog build is an occasional act, and
# an unattended one against a twelve-step repo would file a lot at once.
#
# The build job never touches GitHub issues. It ends with a plan
# (`backlog-actions.json`) uploaded as an artifact and rendered into the job
# summary. The `apply` job below calls backlog-apply.yml, which pauses on the
# `backlog-apply` environment until a reviewer approves, then files *that* plan.
# The approval is therefore against the exact plan you read — not against a
# fresh model session, which is what re-dispatching with `apply: true` used to
# give you.
#
# Advisory. Not a merge gate, not on pull_request.

on:
  workflow_dispatch:
    inputs:
      sources:
        description: 'Documents to read (space-separated paths). Empty = repo defaults; code-only is valid.'
        required: false
        default: ''
      apply:
        description: 'Ask for approval to file the plan. False = plan only; file it later with "Claude backlog apply".'
        type: boolean
        required: false
        default: true

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: backlog-build
  cancel-in-progress: false

env:
  CLAUDE_CLI_VERSION: '2.1.246'

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI (pinned)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"

      - name: Run the backlog-build chain
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          SOURCES: ${{ inputs.sources }}
        run: |
          set -euo pipefail
          mkdir -p backlog-build
          # shellcheck disable=SC2086 -- SOURCES is a deliberate word list
          bash .github/scripts/run-backlog-build.sh backlog-build -- $SOURCES

      - name: Format summary markdown
        env:
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash .github/scripts/format-backlog-build.sh \
            backlog-build/backlog-final.json "$SHA" "$RUN_URL" > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Dump open and prior backlog issues
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const dump = require(path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/dump-backlog-issues.js'
            ));
            await dump({ github, context, core }, 'existing-issues.json');

      - name: Plan issue create/update/skip
        env:
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/plan-backlog-issues.py \
            backlog-build/backlog-final.json existing-issues.json "$SHA" "$RUN_URL" \
            > backlog-actions.json
          # The plan touches the real backlog: refuse a malformed one here
          # rather than half-way through creating issues.
          python3 .github/scripts/validate-json.py \
            .github/schemas/backlog-actions.schema.json backlog-actions.json
          # This is the text the approver reads before releasing the apply job.
          bash .github/scripts/format-backlog-actions.sh backlog-actions.json "$RUN_URL" \
            >> "$GITHUB_STEP_SUMMARY"
          jq '.summary, .dropped' backlog-actions.json
          # The apply job replays the planner against existing-issues.json to
          # prove nothing frozen moved, so it needs the same sha and run URL
          # that went into the bodies above.
          jq -n --arg sha "$SHA" --arg run_url "$RUN_URL" \
                --arg run_id "${{ github.run_id }}" \
                --arg planned_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                '{sha: $sha, run_url: $run_url, run_id: $run_id, planned_at: $planned_at}' \
            > plan-meta.json

      - uses: actions/upload-artifact@v4
        with:
          name: backlog-build
          path: |
            backlog-build/
            summary.md
            existing-issues.json
            backlog-actions.json
            plan-meta.json
          if-no-files-found: error

      - name: Point at the approval
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            echo "::notice::Plan ready. The apply job is waiting on the " \
                 "backlog-apply environment — review the summary above, then approve it."
          else
            echo "::notice::Plan only — no issues touched. To file it, dispatch " \
                 "'Claude backlog apply' with run_id ${{ github.run_id }}."
          fi

  apply:
    name: apply
    needs: build
    if: ${{ inputs.apply }}
    # Same plan, same run. The called workflow pauses on the backlog-apply
    # environment; nothing is written until a reviewer releases it.
    uses: ./.github/workflows/backlog-apply.yml
    with:
      run_id: ${{ github.run_id }}
    permissions:
      contents: read
      issues: write
      actions: read
