name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    # Each event type carries the body in a different place; check them
    # explicitly rather than relying on null-coalescing across contexts.
    # This job holds contents/pull-requests/issues write. The repository is
    # public, so anyone can comment: gate on author_association as well as the
    # trigger phrase. The action gates on write access too, but relying on that
    # alone leaves the trust boundary invisible in this file.
    if: |
      (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@claude') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.review.author_association)) ||
      (github.event_name == 'issues' &&
        (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # The agent must be able to validate before pushing: issue #24's
      # implementation shipped a runtime bug with "no behavior change" in the
      # PR body because dotnet build/test needed an approval nobody was there
      # to give. Install the SDK and pre-approve exactly those commands.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          trigger_phrase: "@claude"
          claude_args: |
            --allowedTools "Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*)"
