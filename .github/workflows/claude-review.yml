name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    # Docs-only PRs are not worth two model calls. A mixed PR (code + docs)
    # still runs because GitHub skips only when *every* path matches.
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '**/*.html'

permissions:
  contents: read
  pull-requests: write

# A rapid series of pushes should not stack up reviews on the same PR.
# Workflow-level: a new run cancels the previous run (both matrix jobs).
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: ${{ matrix.id }}
    # Secrets are withheld from fork PRs, so the review cannot authenticate
    # there. Skip cleanly rather than fail confusingly. Drafts are skipped
    # until ready_for_review; that event is in `on.pull_request.types`.
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: architecture
            prompt: architecture-review.md
            schema: review-verdict.schema.json
            heading: architecture review
            list_key: violations
            list_heading: Violations
            kind_key: rule
            kind_header: Rule
            empty_message: "No architecture rule violations found in this diff."
            model: haiku
            tools: none
            max_budget_usd: "0.15"
          - id: code
            prompt: code-review.md
            schema: code-review.schema.json
            heading: code review
            list_key: findings
            list_heading: Findings
            kind_key: category
            kind_header: Category
            empty_message: "No code-review findings in this diff."
            model: sonnet
            tools: "Read"
            max_turns: "3"
            max_budget_usd: "0.50"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI (pinned)
        run: npm install -g @anthropic-ai/claude-code@2.1.246

      - name: Build review input
        env:
          BASE_REF: ${{ github.base_ref }}
          PROMPT_FILE: .github/prompts/${{ matrix.prompt }}
        run: |
          set -euo pipefail

          git fetch --no-tags origin "$BASE_REF"

          MAX_BYTES=200000
          git diff "origin/${BASE_REF}...HEAD" > full.diff
          DIFF_BYTES=$(wc -c < full.diff)
          echo "diff size: ${DIFF_BYTES} bytes"

          # The diff is written to a file and fed on stdin, never through argv:
          # diff content must not be interpreted by the shell, and large diffs
          # would otherwise exceed the argument limit.
          {
            cat "$PROMPT_FILE"
            printf '\n\n## PR diff\n\n```diff\n'
            head -c "$MAX_BYTES" full.diff
            printf '\n```\n'
            if [ "$DIFF_BYTES" -gt "$MAX_BYTES" ]; then
              printf '\n**NOTE: this diff was TRUNCATED at %s of %s bytes.**\n' \
                "$MAX_BYTES" "$DIFF_BYTES"
            fi
          } > review-input.md

      - name: Run ${{ matrix.heading }}
        id: review
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SCHEMA_FILE: .github/schemas/${{ matrix.schema }}
          MODEL: ${{ matrix.model }}
          TOOLS: ${{ matrix.tools }}
          MAX_TURNS: ${{ matrix.max_turns }}
          MAX_BUDGET_USD: ${{ matrix.max_budget_usd }}
        run: |
          set -uo pipefail

          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "::error::CLAUDE_CODE_OAUTH_TOKEN is not set on this repository."
            echo "claude_exit=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          args=(
            -p
            --output-format json
            --json-schema "$(cat "$SCHEMA_FILE")"
            --permission-mode dontAsk
            --model "$MODEL"
            --max-budget-usd "$MAX_BUDGET_USD"
          )
          # `none` disables built-ins (`--tools ""`). Structured JSON output
          # still works; the existing architecture job already used a restricted
          # `--tools` list with `--json-schema`.
          if [ "$TOOLS" = "none" ]; then
            args+=(--tools "")
          else
            args+=(--tools "$TOOLS" --allowedTools "$TOOLS")
          fi
          if [ -n "${MAX_TURNS:-}" ]; then
            args+=(--max-turns "$MAX_TURNS")
          fi

          # GitHub runs `run:` under `bash -e`, which would abort this step
          # before the exit code can be captured. Disable it around the call.
          set +e
          claude "${args[@]}" < review-input.md > review.json
          CLAUDE_EXIT=$?
          set -e
          echo "claude_exit=${CLAUDE_EXIT}" >> "$GITHUB_OUTPUT"
          echo "claude exited with ${CLAUDE_EXIT}"

          CLAUDE_SUBTYPE=""
          if [ -s review.json ]; then
            jq '{is_error, subtype, total_cost_usd, num_turns}' review.json || true
            CLAUDE_SUBTYPE=$(jq -r '.subtype // empty' review.json 2>/dev/null || true)
          fi
          echo "claude_subtype=${CLAUDE_SUBTYPE}" >> "$GITHUB_OUTPUT"

          # Do not fail here — the comment step runs first so the PR always
          # gets feedback. The job is failed at the end if this exited non-zero.
          exit 0

      - name: Post or update review comment
        if: always()
        uses: actions/github-script@v7
        env:
          REVIEW_ID: ${{ matrix.id }}
          HEADING: ${{ matrix.heading }}
          LIST_KEY: ${{ matrix.list_key }}
          LIST_HEADING: ${{ matrix.list_heading }}
          KIND_KEY: ${{ matrix.kind_key }}
          KIND_HEADER: ${{ matrix.kind_header }}
          EMPTY_MESSAGE: ${{ matrix.empty_message }}
          CLAUDE_SUBTYPE: ${{ steps.review.outputs.claude_subtype }}
        with:
          script: |
            const fs = require('fs');
            const heading = process.env.HEADING;
            const listKey = process.env.LIST_KEY;
            const listHeading = process.env.LIST_HEADING;
            const kindKey = process.env.KIND_KEY;
            const kindHeader = process.env.KIND_HEADER;
            const emptyMessage = process.env.EMPTY_MESSAGE;
            const budgetHit = process.env.CLAUDE_SUBTYPE === 'error_max_budget_usd';
            const MARKER = ``;
            const cell = s => String(s ?? '').replace(/\|/g, '\\|').replace(/\n/g, ' ');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const existing = comments.find(c => c.body && c.body.includes(MARKER));

            let env = null;
            try { env = JSON.parse(fs.readFileSync('review.json', 'utf8')); } catch { env = null; }

            const so = env && env.structured_output;

            // A truncated/degraded run with nothing new to say should not
            // clobber a previously complete review comment on this PR.
            if (!so && existing) {
              core.warning(`${heading}: no structured output this run (budgetHit=${budgetHit}); leaving the existing review comment in place.`);
              return;
            }

            let body;

            if (so && typeof so.verdict === 'string') {
              const approved = so.verdict === 'approve';
              const out = [`## ${approved ? '✅' : '⚠️'} Claude ${heading} — **${approved ? 'approve' : 'request changes'}**`, ''];

              const items = Array.isArray(so[listKey]) ? so[listKey] : [];
              if (items.length === 0) {
                out.push(emptyMessage);
              } else {
                out.push(`### ${listHeading} (${items.length})`, '');
                out.push(`| ${kindHeader} | Severity | File | Detail |`, '|---|---|---|---|');
                for (const item of items) {
                  const kind = cell(item[kindKey]);
                  out.push(`| ${kind} | ${cell(item.severity)} | ${item.file ? '`' + cell(item.file) + '`' : '—'} | ${cell(item.detail)} |`);
                }
              }

              const notes = Array.isArray(so.notes) ? so.notes : [];
              if (notes.length) {
                out.push('', '### Notes');
                for (const n of notes) out.push(`- ${cell(n)}`);
              }

              const cost = typeof env.total_cost_usd === 'number' ? `$${env.total_cost_usd.toFixed(4)}` : 'n/a';
              const sha = context.payload.pull_request.head.sha.slice(0, 7);
              out.push('', `<sub>Advisory only — \`ci.yml\` decides merge. Cost estimate ${cost} · commit ${sha}</sub>`);
              body = out.join('\n');
            } else if (budgetHit) {
              body = [
                `## ⚠️ Claude ${heading} — truncated (budget exceeded)`,
                '',
                'The review hit its cost budget partway through and did not finish, so no verdict is available.',
                'See the workflow run log for details.',
              ].join('\n');
            } else {
              const raw = env && typeof env.result === 'string' ? env.result : '(no output captured)';
              body = [
                `## ⚠️ Claude ${heading} — degraded`,
                '',
                'The review did not return a schema-conforming result, so no verdict is available.',
                'See the workflow run log for details.',
                '',
                '```',
                raw.slice(0, 4000),
                '```',
              ].join('\n');
            }

            body = `${MARKER}\n${body}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;

            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated existing review comment ${existing.id}`);
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info('Created review comment');
            }

      - name: Fail if the review could not run
        # always() so this still runs if the comment step failed.
        if: always() && steps.review.outputs.claude_exit != '0'
        env:
          CLAUDE_SUBTYPE: ${{ steps.review.outputs.claude_subtype }}
        run: |
          if [ "$CLAUDE_SUBTYPE" = "error_max_budget_usd" ]; then
            echo "::warning::The Claude review hit its cost budget and was cut off mid-review."
            exit 0
          fi
          echo "::error::The Claude review step failed. This is an infrastructure"
          echo "::error::failure (auth, network), not a review verdict."
          exit 1