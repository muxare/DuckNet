name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ReviewFlow aggregate fixtures
        run: bash .github/scripts/test-aggregate-review.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: src/DuckNet.DashboardCenter/ui/package-lock.json

      - name: Restore
        run: dotnet restore DuckNet.slnx

      - name: Build
        run: dotnet build DuckNet.slnx --no-restore -c Release

      - name: Test
        run: dotnet test DuckNet.slnx --no-build -c Release --verbosity normal

      - name: Demo smoke (Step 3 kernel)
        run: dotnet run --project src/DuckNet.Kernel/DuckNet.Kernel.csproj -c Release --no-build -- --reset-db --seconds 2

      - name: Docker build Centers
        run: |
          docker build -f infra/docker/DuckNet.TelemetryCenter/Dockerfile -t ducknet-telemetry:ci .
          docker build -f infra/docker/DuckNet.AlarmCenter/Dockerfile -t ducknet-alarm:ci .
          docker build -f infra/docker/DuckNet.DashboardCenter/Dockerfile -t ducknet-dashboard:ci .
