name: Deploy Center

on:
  workflow_dispatch:
    inputs:
      center:
        description: Center to deploy
        required: true
        type: choice
        options:
          - telemetry
          - alarm
          - dashboard
          - all
      environment:
        description: Target environment
        required: true
        type: choice
        default: dev
        options:
          - dev
          - prod
  push:
    branches: [main]
    paths:
      - "src/DuckNet.TelemetryCenter/**"
      - "src/DuckNet.AlarmCenter/**"
      - "src/DuckNet.DashboardCenter/**"
      - "src/DuckNet.Contracts/**"
      - "src/DuckNet.EventBus/**"
      - "infra/docker/**"

permissions:
  contents: read
  packages: write

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      centers: ${{ steps.pick.outputs.centers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CENTER="${{ inputs.center }}"
            if [ "$CENTER" = "all" ]; then
              echo 'centers=["telemetry","alarm","dashboard"]' >> "$GITHUB_OUTPUT"
            else
              echo "centers=[\"$CENTER\"]" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          CENTERS=()
          if git diff --name-only HEAD~1 HEAD | grep -Eq 'src/DuckNet.Contracts/|src/DuckNet.EventBus/'; then
            CENTERS=(telemetry alarm dashboard)
          else
            git diff --name-only HEAD~1 HEAD | grep -q 'src/DuckNet.TelemetryCenter/' && CENTERS+=(telemetry)
            git diff --name-only HEAD~1 HEAD | grep -q 'src/DuckNet.AlarmCenter/' && CENTERS+=(alarm)
            git diff --name-only HEAD~1 HEAD | grep -q 'src/DuckNet.DashboardCenter/' && CENTERS+=(dashboard)
          fi

          if [ ${#CENTERS[@]} -eq 0 ]; then
            echo 'centers=[]' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          JSON=$(printf '"%s",' "${CENTERS[@]}")
          echo "centers=[${JSON%,}]" >> "$GITHUB_OUTPUT"

  deploy:
    needs: matrix
    if: ${{ needs.matrix.outputs.centers != '[]' && needs.matrix.outputs.centers != '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        center: ${{ fromJson(needs.matrix.outputs.centers) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: |
          echo "name=ghcr.io/${{ github.repository_owner }}/ducknet-${{ matrix.center }}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          case "${{ matrix.center }}" in
            telemetry) echo "dockerfile=infra/docker/DuckNet.TelemetryCenter/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            alarm) echo "dockerfile=infra/docker/DuckNet.AlarmCenter/Dockerfile" >> "$GITHUB_OUTPUT" ;;
            dashboard) echo "dockerfile=infra/docker/DuckNet.DashboardCenter/Dockerfile" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Build image
        run: docker build -f "${{ steps.image.outputs.dockerfile }}" -t "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}" .

      - name: Login GHCR
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: |
          docker tag "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}" "${{ steps.image.outputs.name }}:latest"
          docker push "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"
          docker push "${{ steps.image.outputs.name }}:latest"

      - name: Smoke (local image)
        run: |
          docker run -d --name ducknet-smoke -p 8080:8080 "${{ steps.image.outputs.name }}:${{ steps.image.outputs.tag }}"
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null; then
              docker rm -f ducknet-smoke
              exit 0
            fi
            sleep 1
          done
          docker logs ducknet-smoke || true
          docker rm -f ducknet-smoke
          exit 1
