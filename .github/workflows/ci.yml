name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DuckNet.slnx

      - name: Build
        run: dotnet build DuckNet.slnx --no-restore -c Release

      - name: Test
        run: dotnet test DuckNet.slnx --no-build -c Release --verbosity normal

      - name: Demo smoke (Step 2)
        run: dotnet run --project src/DuckNet.Kernel/DuckNet.Kernel.csproj -c Release --no-build -- --run-demo --seconds 2
