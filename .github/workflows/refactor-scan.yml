name: Claude refactor scan

# Whole-tree, advisory. Not a merge gate. Not on pull_request: step PRs must
# not pick up unrelated refactors, and a Sonnet two-pass is ~$1.50.

on:
  schedule:
    # Monday 06:17 UTC. Offset from :00; weekly is enough at this cost.
    # Public-repo cron dies after 60 days of inactivity — dispatch is the net.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: refactor-scan
  cancel-in-progress: true

env:
  CLAUDE_CLI_VERSION: '2.1.246'

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this SHA is already on the sticky issue
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const MARKER = '<!-- ducknet-refactor-scan -->';
            const sha = context.sha;
            const { owner, repo } = context.repo;
            const scheduled = context.eventName === 'schedule';

            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 50,
            });
            const existing = issues.find(i => i.body && i.body.includes(MARKER));
            core.setOutput('issue_number', existing ? String(existing.number) : '');

            if (scheduled && existing && existing.body.includes(`<!-- sha: ${sha} -->`)) {
              core.setOutput('skip', 'true');
              core.info(`HEAD ${sha} already scanned in #${existing.number}`);
            } else {
              core.setOutput('skip', 'false');
            }

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '22'

      - name: Install Claude Code CLI (pinned)
        if: steps.gate.outputs.skip != 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"

      - name: Run two-stage refactor scan
        if: steps.gate.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p refactor-scan
          bash .github/scripts/run-refactor-scan.sh refactor-scan

      - name: Format issue body
        if: steps.gate.outputs.skip != 'true'
        env:
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash .github/scripts/format-refactor-scan.sh \
            refactor-scan/findings-final.json "$SHA" "$RUN_URL" > issue.md
          cat issue.md

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: refactor-scan
          path: |
            refactor-scan/
            issue.md
          if-no-files-found: error

      - name: Post or update sticky issue
        if: steps.gate.outputs.skip != 'true'
        uses: actions/github-script@v7
        env:
          SHA: ${{ github.sha }}
          EXISTING: ${{ steps.gate.outputs.issue_number }}
        with:
          script: |
            const fs = require('fs');
            const MARKER = '<!-- ducknet-refactor-scan -->';
            if (!fs.existsSync('issue.md')) {
              core.setFailed('issue.md was not produced');
              return;
            }
            const sha = process.env.SHA;
            const body = `${MARKER}\n<!-- sha: ${sha} -->\n${fs.readFileSync('issue.md', 'utf8')}\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_`;

            const { owner, repo } = context.repo;
            const existingNumber = process.env.EXISTING;
            let issue_number = existingNumber ? Number(existingNumber) : 0;

            if (!issue_number) {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', per_page: 50,
              });
              const found = issues.find(i => i.body && i.body.includes(MARKER));
              if (found) issue_number = found.number;
            }

            if (issue_number) {
              await github.rest.issues.update({
                owner, repo, issue_number, body, state: 'open',
              });
              core.info(`Updated sticky refactor-scan issue #${issue_number}`);
            } else {
              const created = await github.rest.issues.create({
                owner, repo, title: 'Refactor scan', body,
              });
              core.info(`Created sticky refactor-scan issue #${created.data.number}`);
            }
