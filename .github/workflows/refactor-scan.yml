name: Claude refactor scan

# Whole-tree, advisory. Not a merge gate. Not on pull_request: step PRs must
# not pick up unrelated refactors, and a Sonnet two-pass is ~$1.50.

on:
  schedule:
    # Monday 06:17 UTC. Offset from :00; weekly is enough at this cost.
    # Public-repo cron dies after 60 days of inactivity — dispatch is the net.
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: refactor-scan
  cancel-in-progress: true

env:
  CLAUDE_CLI_VERSION: '2.1.246'

jobs:
  scan:
    name: scan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this SHA already scanned successfully
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            const scheduled = context.eventName === 'schedule';
            if (!scheduled) {
              core.setOutput('skip', 'false');
              return;
            }
            const sha = context.sha;
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner, repo,
              workflow_id: 'refactor-scan.yml',
              head_sha: sha,
              status: 'completed',
              per_page: 10,
            });
            const prior = (data.workflow_runs || []).some(
              (r) => r.id !== context.runId && r.conclusion === 'success'
            );
            if (prior) {
              core.setOutput('skip', 'true');
              core.info(`HEAD ${sha} already has a successful refactor-scan run`);
            } else {
              core.setOutput('skip', 'false');
            }

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          node-version: '22'

      - name: Install Claude Code CLI (pinned)
        if: steps.gate.outputs.skip != 'true'
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"

      - name: Run two-stage refactor scan
        if: steps.gate.outputs.skip != 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p refactor-scan
          bash .github/scripts/run-refactor-scan.sh refactor-scan

      - name: Format summary markdown
        if: steps.gate.outputs.skip != 'true'
        env:
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash .github/scripts/format-refactor-scan.sh \
            refactor-scan/findings-final.json "$SHA" "$RUN_URL" > issue.md
          cat issue.md

      - name: Dump open and prior scan issues
        if: steps.gate.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const open = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', per_page: 100,
            });
            const closed = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'closed', labels: 'refactor-scan', per_page: 100,
            });
            const seen = new Set();
            const issues = [];
            for (const issue of [...open, ...closed]) {
              if (issue.pull_request || seen.has(issue.number)) continue;
              seen.add(issue.number);
              issues.push({
                number: issue.number,
                title: issue.title,
                body: issue.body || '',
                state: issue.state,
                labels: (issue.labels || []).map((l) =>
                  typeof l === 'string' ? l : l.name
                ),
              });
            }
            fs.writeFileSync('existing-issues.json', JSON.stringify(issues, null, 2));
            core.info(`Dumped ${issues.length} issues for matching`);

      - name: Plan issue create/update/skip
        if: steps.gate.outputs.skip != 'true'
        env:
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python3 .github/scripts/plan-refactor-issues.py \
            refactor-scan/findings-final.json existing-issues.json "$SHA" "$RUN_URL" \
            > refactor-actions.json
          cat refactor-actions.json

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.skip != 'true'
        with:
          name: refactor-scan
          path: |
            refactor-scan/
            issue.md
            existing-issues.json
            refactor-actions.json
          if-no-files-found: error

      - name: Create or update per-task issues
        if: steps.gate.outputs.skip != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const apply = require(path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/apply-refactor-issues.js'
            ));
            await apply({ github, context, core });
