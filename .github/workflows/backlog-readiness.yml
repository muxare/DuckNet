name: Claude issue readiness

# One Haiku session per issue, no tools, one sticky comment: could someone pick
# this up on Monday without asking a question first?
#
# Advisory. It cannot block anything — there is no status check here, and it
# never edits, labels, or closes the issue. Machine-written issues are skipped:
# the refactor scan and the backlog build already emit acceptance criteria, and
# re-judging them would be paying to grade our own homework.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  # Per issue: a burst of edits should leave one verdict, not five.
  group: backlog-readiness-${{ github.event.issue.number }}
  cancel-in-progress: true

env:
  CLAUDE_CLI_VERSION: '2.1.246'

jobs:
  readiness:
    name: readiness
    # Machine-authored issues and bot actors are skipped.
    if: >-
      !endsWith(github.actor, '[bot]')
      && !contains(github.event.issue.labels.*.name, 'refactor-scan')
      && !contains(github.event.issue.labels.*.name, 'backlog-build')
      && !contains(github.event.issue.labels.*.name, 'backlog-groom')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code CLI (pinned)
        run: npm install -g "@anthropic-ai/claude-code@${CLAUDE_CLI_VERSION}"

      - name: Extract the issue from the event payload
        run: |
          set -euo pipefail
          jq '{
            number: .issue.number,
            title: .issue.title,
            body: ((.issue.body // "") | if length > 8000 then .[0:8000] + "\n\n[truncated]" else . end),
            labels: [ .issue.labels[].name ]
          }' "$GITHUB_EVENT_PATH" > issue.json
          jq '{number, title, labels}' issue.json

      - name: Judge readiness
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p readiness
          bash .github/scripts/run-backlog-readiness.sh issue.json readiness

      - name: Format the comment
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash .github/scripts/format-readiness.sh \
            readiness/readiness.json "$RUN_URL" > readiness-comment.md
          cat readiness-comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post or update the sticky comment
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const apply = require(path.join(
              process.env.GITHUB_WORKSPACE,
              '.github/scripts/apply-readiness-comment.js'
            ));
            await apply({ github, context, core });
